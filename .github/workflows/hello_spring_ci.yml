name: Hello Spring Boot App CI

on: push

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build and Test (Maven)
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean verify

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: docker/app1-hello/springboot/hello-spring/target/surefire-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Code
        run: echo "Hello fro hello spring boot app"

      - name: Set up JDK 17
        run: echo "Setting up JDK 17 for the build process"

      - name: Build JAP for Docker
        run: echo ""

      - name: Login to Docker Hub
        run: echo ""

      - name: Build and Push Docker Image
        run: echo ""
