name: Second CI environment variables

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello

        run: echo "Hello from the env secrets inputs workflow!"

      - name: Install Dependencies
        env:
          GREETING: "Hello from the second workflow!"
        run: echo "Hi there! $GREETING"
      - name: Use DB
        env:
          MY_ENV: dev
          MY_DB_PASSWORD: ${{ secrets.DB_PASSWORD_DEV }}
        run: echo "Environment $MY_ENV Using $MY_DB_PASSWORD"
